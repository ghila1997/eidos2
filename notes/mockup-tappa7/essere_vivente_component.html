<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essere Vivente</title>
<style>
  /*
    Componente di produzione dell'Essere Vivente (ADR 030: promosso dal
    laboratorio equilibrio). Solo presentazione: riceve stati e livello audio
    via postMessage (type: state/level/pulse/config) e anima. Le leve di
    taratura (type:'lab') restano attive per il pannello
    essere_vivente_lab.html, che pilota questo stesso file.
  */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:transparent}
  @supports (height:100dvh){ html,body{height:100dvh} }

  /* niente sfondo/alone dipinto: il vuoto dietro è l'ambiente di lavoro reale
     dietro l'iframe, non un colore dipinto qui dentro. Nessuna ombra/luce
     propria: il componente non modula più l'ambiente attorno a sé. */
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:1;cursor:grab}
  #scene.grabbing{cursor:grabbing}
</style>
</head>
<body class="state-idle">

<canvas id="scene"></canvas>

<script src="vendor/three.min.js"></script>
<script>
(function(){
  const reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const isCoarse = window.matchMedia('(pointer:coarse)').matches;
  const canvas = document.getElementById('scene');

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 400);
  camera.position.set(0, 0.4, 17);
  const group  = new THREE.Group();
  scene.add(group);

  const GX = 300, GZ = 175;
  const N  = GX * GZ;

  // ---------- forma a VENE RADIALI: nascono dal nucleo e disegnano la superficie ----------
  // Le vene partono dal centro, serpeggiano verso un bersaglio sulla superficie del blob
  // (stessa formula "blob" di sempre) e si ramificano; le punte disegnano il guscio -> la
  // sagoma e' fatta dalle vene, non da una sfera preesistente tinta di venature.
  // Tre gruppi di particelle sommati, mai in competizione tra loro (ognuna nasce gia'
  // assegnata al suo gruppo, per percentile aCoreRand): vene, nucleo (denso, dedicato),
  // membrana (silhouette netta nei movimenti). Nessuna leva 'lab' su questi parametri:
  // valori confermati, fissi in produzione. Dettagli e alternative scartate in
  // docs/superpowers/specs/2026-07-23-struttura-vene-radiali-essere-vivente-design.md
  const R_FORM=6.3;
  const GEO={veins:38, branch:0.55, thick:0.5, coreCount:35000, coreR:2.0, shellCount:24000};
  function blobR(th,ph){
    return R_FORM*(1
      +0.16*Math.sin(3*th+1.1)*Math.cos(2*ph-0.4)
      +0.09*Math.sin(2*th-2*ph+0.6)
      +0.05*Math.sin(5*ph+2*th));
  }
  function buildShapes(){
    const NC=Math.max(0,Math.round(GEO.coreCount)); // nucleo: aggiunte, non rubate alle vene
    const NS=Math.max(0,Math.round(GEO.shellCount)); // membrana di superficie: idem
    const NT=N+NC+NS;
    const position=new Float32Array(NT*3),
          scale=new Float32Array(NT), phase=new Float32Array(NT),
          rand=new Float32Array(NT), coreRand=new Float32Array(NT);
    function h(a,b,c){ const s=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453; return s-Math.floor(s); }

    // scheletro delle vene: nodi piatti [x,y,z, tt(0=cuore,1=punta), w(spessore)]
    const skel=[];
    function grow(x,y,z, tx,ty,tz, depth, seed){
      const steps = depth===0?22:14;
      for(let s=0;s<steps;s++){
        let dx=tx-x, dy=ty-y, dz=tz-z; let dl=Math.hypot(dx,dy,dz);
        if(dl<0.05) break;
        dx/=dl;dy/=dl;dz/=dl;
        const tt0=s/steps;
        const wob=0.75*(1-tt0); // serpeggia vicino al cuore, si raddrizza verso la punta
        dx+=(h(seed,s,1)-0.5)*wob; dy+=(h(seed,s,2)-0.5)*wob; dz+=(h(seed,s,3)-0.5)*wob;
        const dl2=Math.hypot(dx,dy,dz)||1; dx/=dl2;dy/=dl2;dz/=dl2;
        const step=dl/(steps-s); // copre la distanza rimasta fino al bersaglio
        x+=dx*step; y+=dy*step; z+=dz*step;
        const tt=(s+1)/steps;
        const w=GEO.thick*(0.18+0.82*(1-tt))*(depth===0?1.0:0.62);
        skel.push(x,y,z,tt,w);
        // biforcazione: un ramo figlio verso un altro punto vicino della superficie
        if(depth<2 && s>steps*0.35 && s<steps*0.9 && h(seed,s,7)<GEO.branch*0.28){
          const rr=Math.hypot(x,y,z)||0.0001;
          let cx=x/rr+(h(seed,s,11)-0.5)*0.8, cy=y/rr+(h(seed,s,12)-0.5)*0.8, cz=z/rr+(h(seed,s,13)-0.5)*0.8;
          const cl=Math.hypot(cx,cy,cz)||1; cx/=cl;cy/=cl;cz/=cl;
          const cph=Math.acos(Math.max(-1,Math.min(1,cy))), cth=Math.atan2(cz,cx);
          const cR=blobR(cth,cph);
          grow(x,y,z, cx*cR, cy*cR, cz*cR, depth+1, seed*1.7+s+depth*31.7);
        }
      }
    }
    // vene primarie: direzioni distribuite uniformi (fibonacci) -> bersagli sul guscio
    const NV=Math.max(6,Math.round(GEO.veins)), ga=Math.PI*(3-Math.sqrt(5));
    for(let i=0;i<NV;i++){
      const yy=1-(i/(NV-1))*2, rr=Math.sqrt(Math.max(0,1-yy*yy)), a=ga*i;
      const ux=Math.cos(a)*rr, uy=yy, uz=Math.sin(a)*rr;
      const ph=Math.acos(Math.max(-1,Math.min(1,uy))), th=Math.atan2(uz,ux);
      const cR=blobR(th,ph);
      grow(0,0,0, ux*cR, uy*cR, uz*cR, 0, i*7.3+2.1);
    }

    const M=skel.length/5;
    for(let i=0;i<N;i++){
      const i3=i*3;
      scale[i]=0.5+Math.random()*1.4; phase[i]=Math.random()*Math.PI*2; rand[i]=Math.random();
      coreRand[i]=0.25+Math.random()*0.75; // mai reclutata dal nucleo: resta sulle vene

      // nodo casuale, con leggera preferenza per i nodi esterni (tt alto) così le
      // punte coprono bene la superficie e la sagoma tonda resta leggibile
      let k=(Math.random()*M)|0;
      const k2=(Math.random()*M)|0; if(skel[k2*5+3]>skel[k*5+3]) k=k2;
      const nx=skel[k*5], ny=skel[k*5+1], nz=skel[k*5+2], w=skel[k*5+4];
      // offset perpendicolare alla direzione radiale -> spessore a sezione tonda
      const rr=Math.hypot(nx,ny,nz)||0.0001; const ux=nx/rr,uy=ny/rr,uz=nz/rr;
      let ex=Math.random()-0.5, ey=Math.random()-0.5, ez=Math.random()-0.5;
      const dot=ex*ux+ey*uy+ez*uz; ex-=ux*dot; ey-=uy*dot; ez-=uz*dot;
      const el=Math.hypot(ex,ey,ez)||1; ex/=el;ey/=el;ez/=el;
      const rad=Math.sqrt(Math.random())*w;
      position[i3]=nx+ex*rad; position[i3+1]=ny+ey*rad; position[i3+2]=nz+ez*rad;
    }

    // --- NUCLEO: particelle DEDICATE, aggiunte OLTRE a quelle delle vene ---
    // coreRand basso -> sempre reclutate dal nucleo (uCoreSize~0.18), mentre le vene
    // (coreRand>=0.25) non ne perdono nessuna. Più coreCount = cuore più fitto e denso,
    // indipendentemente da quante particelle hanno le vene.
    for(let j=0;j<NC;j++){
      const i=N+j, i3=i*3;
      scale[i]=0.6+Math.random()*1.1; phase[i]=Math.random()*Math.PI*2; rand[i]=Math.random();
      coreRand[i]=Math.random()*0.12;
      const u=Math.random(), v=Math.random(); const th=2*Math.PI*u, ph=Math.acos(1-2*v);
      const rr=GEO.coreR*Math.cbrt(Math.random()); // denso verso il centro
      position[i3]=rr*Math.sin(ph)*Math.cos(th); position[i3+1]=rr*Math.cos(ph); position[i3+2]=rr*Math.sin(ph)*Math.sin(th);
    }

    // --- MEMBRANA: particelle sulla SUPERFICIE del blob (aggiunte) ---
    // ridà la silhouette netta nei movimenti/rotazioni, che con le sole vene (più rade
    // sulla superficie) si perdeva. Mai reclutata dal nucleo.
    for(let j=0;j<NS;j++){
      const i=N+NC+j, i3=i*3;
      scale[i]=0.5+Math.random()*1.2; phase[i]=Math.random()*Math.PI*2; rand[i]=Math.random();
      coreRand[i]=0.25+Math.random()*0.75;
      const u=Math.random(), v=Math.random(); const th=2*Math.PI*u, ph=Math.acos(1-2*v);
      const Rb=blobR(th,ph)*(0.9+0.1*Math.random());
      const jx=(Math.random()-0.5)*0.12, jy=(Math.random()-0.5)*0.12, jz=(Math.random()-0.5)*0.12;
      position[i3]=Rb*Math.sin(ph)*Math.cos(th)+jx; position[i3+1]=Rb*Math.cos(ph)+jy; position[i3+2]=Rb*Math.sin(ph)*Math.sin(th)+jz;
    }
    return {position,scale,phase,rand,coreRand};
  }
  const S = buildShapes();

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(S.position,3));
  geo.setAttribute('aScale',   new THREE.BufferAttribute(S.scale,1));
  geo.setAttribute('aPhase',   new THREE.BufferAttribute(S.phase,1));
  geo.setAttribute('aRand',    new THREE.BufferAttribute(S.rand,1));
  geo.setAttribute('aCoreRand',new THREE.BufferAttribute(S.coreRand,1));

  // valori di partenza = palette complementare/riposo reale (niente più flash
  // di colore sbagliato nei primi secondi mentre il lerp lo corregge)
  const cIn=new THREE.Color(1.30,0.55,0.15), cMid=new THREE.Color(0.55,0.35,0.60),
        cOut=new THREE.Color(0.10,0.30,0.65), cCore=new THREE.Color(1.60,0.85,0.35);

  const uniforms = {
    uTime:{value:0}, uSize:{value:3.8}, uDist:{value:17},
    uRipAmp:{value:0}, uRipR:{value:0},
    uFlow:{value:0.5}, uLevel:{value:0}, uReact:{value:0}, uBreath:{value:0},
    uHeart:{value:0}, uHeartAmt:{value:0.5}, uHeartBoost:{value:1.0}, uHeartGlow:{value:0}, uCoreSize:{value:0.18}, uCoreGlowR:{value:0.975}, uCorePull:{value:0.5}, uEmit:{value:0}, uDrive:{value:0}, uStateScale:{value:1}, uWord:{value:0}, uBass:{value:0}, uTreble:{value:0},
    uDensity:{value:1.0}, uSizeBoost:{value:0.5}, uBrightness:{value:0.4}, uVeinGain:{value:0.70},
    uReactMode:{value:0}, uZoom:{value:1.0},
    uCIn:{value:cIn}, uCMid:{value:cMid}, uCOut:{value:cOut}, uCCore:{value:cCore},
    // venature (caldo/freddo per-particella): prima costanti fisse nello shader,
    // ora leva per-palette (vedi PALETTES[..].vein) cosi' anche la "trama"
    // dell'entita' cambia carattere, non solo i 4 colori di stato
    uVeinIn:{value:new THREE.Color(1.0,0.84,0.50)}, uVeinMid:{value:new THREE.Color(0.55,0.35,0.95)},
    uVeinOut:{value:new THREE.Color(0.18,0.22,0.60)}, uVeinCore:{value:new THREE.Color(1.0,0.92,0.78)},
    uVeinMode:{value:0},
    // solo per uVeinMode=1 (iridescente): vedi PALETTES[..].vein.hueOffset/noiseScale/sat/speed
    uVeinHueOffset:{value:0}, uVeinNoiseScale:{value:0.6}, uVeinSat:{value:0.70}, uVeinSpeed:{value:0.03},
  };

  const mat=new THREE.ShaderMaterial({
    uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`
      attribute float aScale; attribute float aPhase; attribute float aRand; attribute float aCoreRand;
      uniform float uTime,uSize,uDist,uFlow,uLevel,uReact,uBreath,uHeart,uHeartAmt,uHeartBoost,uHeartGlow,uCorePull,uEmit,uDrive,uStateScale,uWord,uBass,uTreble,uRipAmp,uRipR,uCoreSize,uCoreGlowR,uDensity,uSizeBoost,uBrightness,uReactMode,uZoom,uVeinGain,uVeinMode,uVeinHueOffset,uVeinNoiseScale,uVeinSat,uVeinSpeed;
      uniform vec3 uCIn,uCMid,uCOut,uCCore,uVeinIn,uVeinMid,uVeinOut,uVeinCore;
      varying vec3 vColor; varying float vAlpha;

      vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
      float snoise(vec3 v){
        const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
        vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
        vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod(i,289.0);
        vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
        float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
        vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
        vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
        vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
        vec4 mn=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); mn=mn*mn;
        return 42.0*dot(mn*mn,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
      }
      vec3 snoiseVec3(vec3 x){return vec3(snoise(x),snoise(x+vec3(123.4,234.5,345.6)),snoise(x+vec3(-345.6,-234.5,-123.4)));}
      vec3 hsv2rgb(vec3 c){
        vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);
        vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);
        return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);
      }
      vec3 curl(vec3 p){
        const float e=0.12; vec3 dx=vec3(e,0.,0.),dy=vec3(0.,e,0.),dz=vec3(0.,0.,e);
        vec3 px0=snoiseVec3(p-dx),px1=snoiseVec3(p+dx),py0=snoiseVec3(p-dy),py1=snoiseVec3(p+dy),pz0=snoiseVec3(p-dz),pz1=snoiseVec3(p+dz);
        float x=(py1.z-py0.z)-(pz1.y-pz0.y); float y=(pz1.x-pz0.x)-(px1.z-px0.z); float z=(px1.y-px0.y)-(py1.x-py0.x);
        return vec3(x,y,z)/(2.0*e);
      }

      void main(){
        vec3 pos=position;

        float rxz=length(pos.xz);
        float tw2=sin(uTime*0.22+aPhase*0.4)*0.9/(0.6+rxz*0.18);
        float ca=cos(tw2),sa=sin(tw2); pos.xz=mat2(ca,-sa,sa,ca)*pos.xz;

        pos*=(1.0+uBreath)*uStateScale;

        // percentile: le particelle con aCoreRand basso entrano nel nucleo. uCoreSize
        // (leva live) decide quante -> dimensione/densità del cuore senza rebuild geometria
        float coreW=1.0-smoothstep(uCoreSize-0.06,uCoreSize+0.06,aCoreRand);
        vec3 hp=normalize(pos+vec3(aRand-0.5,aRand*0.7-0.35,0.5-aRand))*(0.8+aRand*2.1);
        pos=mix(pos,hp,coreW*0.96);

        vec3 flow=curl(pos*0.16+vec3(0.0,uTime*0.06,uTime*0.04));
        pos+=flow*(uFlow+uLevel*0.6);

        float r=length(pos); vec3 dir=r>0.0001?pos/r:vec3(0.0);
        // uHeartBoost > 1 allarga il raggio d'azione del battito, non solo il centro
        float nearCore=exp(-r*(0.34/(0.55+0.45*uHeartBoost)));
        pos+=dir*uHeart*uHeartAmt*uHeartBoost*(0.5+2.4*nearCore);
        pos-=dir*uCorePull*nearCore*1.4;
        pos+=dir*uBass*nearCore*1.4;

        float ripple=snoise(pos*0.5+uTime*0.6);
        pos+=dir*uDrive*uReact*(0.6+0.4*ripple);

        // reazione vocale di "parla": 4 alternative selezionabili (uReactMode),
        // tutte guidate dagli stessi ingressi (uDrive=energia continua, uWord=
        // impulso di parola) ma con geometria di spostamento diversa
        if(uReactMode<0.5){
          // 0 - ONDA ORIGINALE: guscio concentrico che attraversa tutto il corpo
          float ring=sin(r*1.4-uTime*5.0);
          pos+=dir*uEmit*uDrive*(0.5+0.7*ring)*1.05;
          pos+=dir*uEmit*uWord*0.9;
        } else if(uReactMode<1.5){
          // 1 - TURBOLENZA ORGANICA: stesso campo di flusso (curl noise) che
          // deforma i filamenti, solo piu' intenso -> nessuna simmetria radiale,
          // si muove come corrente/fumo, non come onda che si espande
          pos+=flow*uEmit*uDrive*1.3;
          pos+=flow*uEmit*uWord*1.1;
        } else if(uReactMode<2.5){
          // 2 - PULSAZIONE INTERNA: la spinta resta vicino al nucleo (nearCore,
          // gia' calcolato sopra per il battito) invece di propagarsi come
          // guscio su tutta la superficie -> si legge come un respiro/battito
          // interno, il bordo esterno resta calmo
          pos+=dir*uEmit*uDrive*nearCore*2.0;
          pos+=dir*uEmit*uWord*nearCore*1.6;
        } else {
          // 3 - VIBRAZIONE LOCALE: ogni particella si sposta lungo una direzione
          // propria (da aRand), non lungo il raggio -> shimmer/vibrazione diffusa,
          // nessun movimento coerente su larga scala, ne' radiale ne' a corrente
          vec3 jitterDir=normalize(vec3(aRand-0.5, fract(aRand*37.0)-0.5, fract(aRand*91.0)-0.5)+0.0001);
          pos+=jitterDir*uEmit*uDrive*aRand*0.9;
          pos+=jitterDir*uEmit*uWord*aRand*0.7;
        }

        // onda-pensiero: cerchi calmi durante "pensa"
        float ripband=exp(-pow((r-uRipR)*1.1,2.0));
        pos+=dir*uRipAmp*ripband*1.1;

        // profondità reale rispetto alla camera, calcolata ORA (dopo tutte le
        // deformazioni) cosi' fronte/retro dipendono da dove sta l'osservatore,
        // non da dove sta la particella nell'oggetto -> sopravvive alla somma
        // additiva ed e' coerente su tutta la nuvola alla stessa profondita'
        vec4 mv=modelViewMatrix*vec4(pos,1.0);
        float depthSpread=8.0;
        float closeness=clamp(((mv.z+uDist)/depthSpread)*0.5+0.5,0.0,1.0);

        // caldo/freddo per-particella, agganciato allo stesso campo di rumore
        // che deforma i filamenti (stessa scala 0.16 del flow curl) -> il
        // colore segue le venature vere dell'entità, non una tinta uniforme.
        // Un respiro condiviso lento (~25s) tiene comunque le venature in fase
        // tra loro invece di sembrare statiche/casuali.
        // due ottave (una larga tipo il flusso, una più fine) invece di una
        // sola -> vene sottili leggibili, non un'unica sfumatura morbida
        float warmNoiseRaw=snoise(pos*0.16+vec3(0.0,uTime*0.05,uTime*0.035))*0.6
                       +snoise(pos*0.42+vec3(0.0,uTime*0.07,-uTime*0.05))*0.4;
        float warmNoise=warmNoiseRaw*0.5+0.5;
        // contrasto: spinge verso gli estremi invece di una transizione morbida,
        // così si legge come "vena" invece che come velo uniforme
        warmNoise=smoothstep(0.38,0.62,warmNoise);
        float warmBreath=0.5+0.5*sin(uTime*0.25);
        float warmK=clamp(warmNoise*0.95+warmBreath*0.20-0.075,0.0,1.0);
        // venature: uVeinMode 0 = mescola fra due colori fissi (comportamento
        // originale, guidato dal palette selezionato); uVeinMode 1 = la tinta
        // ruota nello spettro seguendo lo stesso rumore (effetto madreperla/
        // iridescente, usato dalla palette "prisma") invece di restare fra
        // due estremi fissi
        vec3 cInW,cMidW,cOutW,cCoreW;
        if(uVeinMode<0.5){
          cInW=mix(uCIn,uVeinIn,warmK); cMidW=mix(uCMid,uVeinMid,warmK);
          cOutW=mix(uCOut,uVeinOut,warmK); cCoreW=mix(uCCore,uVeinCore,warmK);
        } else {
          // uVeinNoiseScale: quanto il rumore fa girare la tinta -> banda stretta
          // (poche tinte vicine, es. "acquamarina") o spettro pieno ("prisma").
          // uVeinHueOffset sposta la banda sulla ruota, uVeinSpeed la velocità

          cOutW=mix(uCOut,iri*0.55,0.55); cCoreW=mix(uCCore,iri*1.4,0.35);
        }

        vec3 col=t<0.5?mix(cInW,cMidW,t*2.0):mix(cMidW,cOutW,(t-0.5)*2.0);

    // dolcemente a tratti, respiro lento ~22s) più la reazione all'energia sopra.

    const glowFloor=0.78+0.18*slowBreath;
    const glowTarget=Math.max(glowFloor, Math.min(1.2,level*1.3))*heartBoost;
    heartGlow+=(glowTarget-heartGlow)*(glowTarget>heartGlow?0.10:0.03);
    uniforms.uHeartGlow.value=heartGlow;

      // una componente verso la camera, altrimenti girerebbe "di taglio" e
      // sembrerebbe fermo) e il mix tra X e Y scorre lentamente nel tempo,

      tumbleQuat.setFromAxisAngle(tumbleAxis, 0.11*rotBoost*dt);
      group.quaternion.premultiply(tumbleQuat);
      // tengo Euler/target allineati così un drag che riparte non scatta
      curRX=group.rotation.x; curRY=group.rotation.y; targRX=curRX; targRY=curRY;
    }

    const par=isCoarse?0.25:1.0; const tx=mx*0.8*par, ty=0.4-my*0.5*par;
    camera.position.x+=(tx-camera.position.x)*0.04; camera.position.y+=(ty-camera.position.y)*0.04;
    camera.lookAt(0,0,0);

    if(flags.ripple && state===THINKING && t-ripStart>1.5){
      ripStart=t;
    }
    if(flags.ripple){
      const ripAge=t-ripStart;
      if(ripAge<1.2){
        uniforms.uRipR.value=ripAge*7.5;
        uniforms.uRipAmp.value=0.9*Math.exp(-ripAge*1.8);
      } else uniforms.uRipAmp.value=0;
    } else {
      uniforms.uRipAmp.value=0;
    }

    // uCIn/uMid/uOut/uCore restano il colore puro dello stato (tIn/tMid/... già
    // aggiornati da setState/applyPalette): il caldo/freddo ora vive nello
    // shader, per-particella, agganciato al rumore dei filamenti
    cIn.copy(fIn).lerp(tIn,colorEase); cMid.copy(fMid).lerp(tMid,colorEase);
    cOut.copy(fOut).lerp(tOut,colorEase); cCore.copy(fCore).lerp(tCore,colorEase);

    if(coreSprite){
      const s=4.7+0.8*heartGlow+1.0*level; // raggio confermato (nucleo sempre acceso)
      coreSprite.scale.set(s,s,s);
      coreSprite.material.color.copy(cCore);
      coreSprite.material.opacity=0.30+0.34*heartGlow+0.12*level; // base alta: mai spento
    }

    renderer.render(scene,camera); requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
