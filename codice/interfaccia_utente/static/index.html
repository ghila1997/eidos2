<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#04040c">
<title>Eidos</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="void"></div>

<div class="brand-lockup">
  <div class="mark">eidos</div>
  <div class="acr"><b>E</b>nhanced <b>I</b>ntelligent <b>D</b>igital <b>O</b>perating <b>S</b>ystem</div>
</div>

<!-- LOGIN (ripreso da v1). Provider Google/Microsoft e login-dev: Tappa 8. -->
<section id="login" hidden>
  <div id="login-box">
    <div class="login-lead">
      <span class="k">Dal pensiero alla forma</span>
      <p class="h">Accedi<br><b>per iniziare.</b></p>
    </div>
    <div class="auth">
      <form id="login-form">
        <div class="field">
          <input id="login-email" type="email" placeholder=" " autocomplete="email" required>
          <label for="login-email">Email</label>
          <span class="underline"></span>
        </div>
        <div class="field">
          <input id="login-password" type="password" placeholder=" " autocomplete="current-password" required>
          <label for="login-password">Password</label>
          <span class="underline"></span>
        </div>
        <button type="submit" class="enter">Entra</button>
      </form>
      <p id="login-error" hidden></p>
    </div>
  </div>
</section>

<!-- APP: essere vivente + barra + log azioni + conferma + input (Tappa 7.1-7.2). -->
<section id="app" hidden>
  <div id="essere-vivente-wrap">
    <iframe id="essere-vivente" title="Essere Vivente" src="/static/essere_vivente_component.html"></iframe>
  </div>

  <!-- spia stato connessione (7.2): un prodotto non fallisce in silenzio. -->
  <div id="conn-status" data-stato="online" title="Connessione">
    <span class="dot"></span><span class="txt">Online</span>
  </div>

  <!-- dock in basso: conversazione (sopra) + scheda di conferma (in mezzo) +
       input (sotto), impilati. Così la scheda si incastra sopra l'input e
       spinge SU la conversazione invece di coprirla (7.3). -->
  <div id="dock">
    <!-- superficie conversazione UNICA (7.3): sopra l'input. Ambient (dialogo):
         passi + testo traslucidi; a riposo restano ma discreti. Espansa
         (lettura): cronologia a contrasto pieno, azioni inline come processo.
         Lo storico persiste per tenant e sopravvive al refresh. -->
    <div id="convo" class="settled">
      <button id="convo-toggle" type="button" aria-expanded="false"
              aria-label="Espandi cronologia" aria-controls="history"
              title="Espandi / richiudi la cronologia"><span class="chev">⌃</span></button>
      <div id="ambient" aria-live="polite"></div>
      <div id="history" aria-label="Cronologia conversazione"></div>
    </div>

    <!-- gate di conferma visivo (7.2): riempito dal JS con la descrizione del
         server (formato "tipo mail"); scadenza gestita lato server (TTL 1h). -->
    <div id="confirm-box" role="alertdialog" aria-labelledby="cf-title" hidden></div>

    <div id="controls">
      <form id="text-form">
        <input id="text-input" type="text" placeholder="Scrivi un messaggio…" autocomplete="off">
        <button type="submit">Invia</button>
      </form>
    </div>
  </div>
</section>

<script src="/static/app.js"></script>
</body>
</html>
